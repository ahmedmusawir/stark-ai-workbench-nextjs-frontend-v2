<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Attempt-002 QA environment control: hide the workstation's OS-installed Inter (Zorin OS package) from the test browser so the
     product's blocked-font fallback (Inter Fallback = local Arial with metric overrides) is actually rendered. Product untouched. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont><glob>/usr/share/fonts/truetype/inter-zorin-os/*</glob></rejectfont></selectfont>
</fontconfig>
